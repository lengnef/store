<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="images/icon.png">
  <title>lengnef • Góc việt hóa font</title>
  <link href='https://fonts.googleapis.com/css?family=Manrope' rel='stylesheet'>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.0.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --primary: #994f36;
      --muted: #b0786b;
      --border: #e8d8ce;
      --accent: #c97a5e;
      --style: #f4ede5;
      --white: #ffffff;
      --btndl-gradient: linear-gradient(130deg, #eb9373, #cf795c);
      --bluegradient: linear-gradient(90deg, #549bff, #2a81ff);
      --shadow: rgba(189,103,75,0.12);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: var(--bg);
      font-family: 'Manrope', sans-serif;
      color: var(--primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      letter-spacing: 0.3px;
    }

    /* 404 SECTION */
    .page-404 {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 40px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .page-404::before {
      content: '';
      position: absolute;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(235,147,115,0.18), transparent 90%);
      top: -150px; right: -150px;
      border-radius: 50%;
      pointer-events: none;
    }

    .page-404::after {
      content: '';
      position: absolute;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(201,122,94,0.14), transparent 90%);
      bottom: -100px; left: -100px;
      border-radius: 50%;
      pointer-events: none;
    }

    .big-number {
      font-family: 'Manrope', sans-serif;
      font-weight: 800;
      font-size: clamp(100px, 20vw, 220px);
      line-height: 1;
      letter-spacing: -6px;
      background: linear-gradient(135deg, #e8d8ce 0%, #c97a5e 50%, #994f36 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: floatUp 4s ease-in-out infinite;
      position: relative;
      z-index: 1;
    }

    @keyframes floatUp {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }

    .icon-404 {
      font-size: 48px;
      color: var(--accent);
      margin: 8px 0 18px;
      position: relative;
      z-index: 1;
      animation: wobble 3s ease-in-out infinite;
    }

    @keyframes wobble {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(10deg); }
      75% { transform: rotate(-10deg); }
    }

    .title-404 {
      font-family: 'Manrope', sans-serif;
      font-weight: 700;
      font-size: clamp(1.5rem, 3.5vw, 2.4rem);
      color: var(--primary);
      margin-bottom: 12px;
      position: relative;
      z-index: 1;
    }

    .desc-404 {
      color: var(--muted);
      font-size: 1.2rem;
      max-width: 600px;
      line-height: 1.75;
      margin-bottom: 36px;
      position: relative;
      z-index: 1;
    }

    .actions-404 {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      position: relative;
      z-index: 1;
    }

    .btn-home {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 28px; border-radius: 50px;
      background: var(--btndl-gradient);
      color: white; font-size: 0.9rem;
      font-family: 'Manrope', sans-serif;
      text-decoration: none; border: none; cursor: pointer;
      transition: all 0.22s ease;
      box-shadow: 0 4px 14px rgba(197,118,91,0.35);
    }
    .btn-home:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(197,118,91,0.45); }

    .btn-back {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 28px; border-radius: 50px;
      background: var(--style); color: var(--primary);
      font-size: 0.95rem; font-family: 'Manrope', sans-serif; font-weight: 600;
      text-decoration: none; border: 1.5px solid var(--border);
      cursor: pointer; transition: all 0.22s ease;
    }
    .btn-back:hover { background: var(--border); transform: translateY(-3px); }

    /* Floating tags */
    .floating-fonts {
      position: absolute; inset: 0;
      overflow: hidden; pointer-events: none; z-index: 0;
    }

    .float-tag {
      position: absolute;
      background: rgba(244,237,229,0.65);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 0.72rem;
      color: var(--muted);
      white-space: nowrap;
      opacity: 0;
      animation: floatTag linear infinite;
    }

    @keyframes floatTag {
      0%   { opacity: 0; transform: translateY(30px); }
      15%  { opacity: 0.65; }
      85%  { opacity: 0.65; }
      100% { opacity: 0; transform: translateY(-40px); }
    }

    /* FOOTER */
    footer {
      background: var(--white);
      border-top: 1.5px solid var(--border);
      padding: 20px 40px;
      text-align: center;
    }
    .footer-text { font-size: 13px; color: var(--muted); }

    @media (max-width: 640px) {
      header { padding: 12px 18px; height: auto; flex-wrap: wrap; gap: 10px; }
      .header-right { width: 100%; justify-content: center; flex-wrap: wrap; }
      .btn-header { font-size: 12px; padding: 7px 12px; }
      .page-404 { padding: 40px 18px; }
      footer { padding: 16px 18px; }
    }
  </style>
</head>
<body>



<section class="page-404">
  <div class="floating-fonts" id="floatingFonts"></div>

  <div class="big-number">404</div>
<br>
  <h1 class="title-404">OOPPPS!</h1>
  <p class="desc-404">
    Font không tồn tại hoặc bổn cung đã vô tình xóa mất.
  </p>
  <div class="actions-404">
    <a href="/store/" class="btn-home">
      <i class="ri-home-4-line"></i> Về trang chủ
    </a>
  </div>
</section>

<script>
  const names = [
    'LF Rancho','LF Satisfy','LF Cezanne','LF Migra','LF Bridget',
    'LF Oregano','LF Amoresa','LF Archer','LF Playful','LF Shantay',
    'LF Klaristha','LF Gelato Fresco','LF Cadet','LF Cyrene','LF Glifta',
    'LF Rochester','LF Heycomic','LF Losbanditos','LF Monarda','LF Verlag'
  ];
  const container = document.getElementById('floatingFonts');
  names.forEach((name, i) => {
    const tag = document.createElement('span');
    tag.className = 'float-tag';
    tag.textContent = name;
    tag.style.left = `${3 + (i * 4.7) % 92}%`;
    tag.style.top  = `${8 + (i * 8.1) % 84}%`;
    tag.style.animationDelay = `${i * 0.5}s`;
    tag.style.animationDuration = `${7 + (i % 5)}s`;
    container.appendChild(tag);
  });
</script>
</body>
</html>
